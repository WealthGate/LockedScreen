name: Build MSIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify makeappx
        shell: pwsh
        run: |
          if (-not (Get-Command makeappx.exe -ErrorAction SilentlyContinue)) {
            Write-Error 'makeappx.exe not found. Install Windows SDK on this runner.'
          }

      - name: Build MSIX
        shell: pwsh
        run: |
          .\scripts\generate-icons.ps1
          .\installer\build-msix.ps1 -Publisher "CN=YourPublisher" -Version "1.0.0.0" -Output "installer\Lockedscreen.msix"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: lockedscreen-msix
          path: installer/Lockedscreen.msix
