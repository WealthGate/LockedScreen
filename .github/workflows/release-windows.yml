name: Build LockedScreen Windows setup
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - name: Test exam isolation and existing workflows
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path apps/desktop/test,packages/storage/test -Filter *.test.mjs -File | Select-Object -ExpandProperty FullName)
          node --test @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project apps/windows-lockdown/KeyboardPolicy.Tests/KeyboardPolicy.Tests.csproj -c Release
      - name: Test hosted OAuth isolation
        shell: pwsh
        run: |
          npm ci --prefix services/google-oauth
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test services/google-oauth/test/oauth.test.mjs
      - name: Build Teacher installer
        shell: pwsh
        run: ./scripts/build-edition.ps1 -Edition teacher -Target github
      - name: Build Student installer
        shell: pwsh
        run: ./scripts/build-edition.ps1 -Edition student -Target github -SkipNative
      - name: Build role-selecting web setup
        shell: pwsh
        run: ./scripts/build-web-setup.ps1 -Test
      - name: Upload for supervised release validation
        uses: actions/upload-artifact@v4
        with:
          name: LockedScreen-Windows-setup
          path: |
            apps/desktop/dist-editions/*/github/*.exe
            apps/desktop/dist-editions/*/github/*.blockmap
            apps/desktop/dist-editions/student/github/student.yml
            apps/desktop/dist-editions/teacher/github/teacher.yml
            apps/desktop/dist-editions/web/LockedScreen-Setup-*.exe
            apps/desktop/dist-editions/web/latest.yml
