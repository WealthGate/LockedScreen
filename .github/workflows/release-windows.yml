name: Build Windows editions
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Build Teacher installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-edition.ps1 -Edition teacher -Target github
      - name: Build Student installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-edition.ps1 -Edition student -Target github -SkipNative
      - name: Upload for supervised release validation
        uses: actions/upload-artifact@v4
        with:
          name: LockedScreen-Windows-editions
          path: |
            apps/desktop/dist-editions/*/github/*.exe
            apps/desktop/dist-editions/*/github/*.blockmap
            apps/desktop/dist-editions/*/github/*.yml
